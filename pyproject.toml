[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "Local command line log analyzer."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "LogLens" }
]

[project.scripts]
loglens = "loglens.cli:main"

[tool.setuptools]
packages = ["loglens"]
